# Yumurta stili videoyu parçalara bölüp aynı anda birçok makinede render eder, birleştirir, sesi ekler.
# Tetikleme: gh workflow run yumurta-render.yml -f story=<yumurta/stories altındaki klasör> [-f parts=8] [-f scale=1]
# Çıktı: "final" adlı artifact içinde <story>.mp4 (indir: gh run download <run_id> -n final -D <klasör>)
# Önce görev, hikâyenin klasörünü (story.js, voice/, audio/mix.wav) main'e push etmiş olmalı.
name: yumurta-render
run-name: render ${{ inputs.story }} (${{ inputs.parts }} parça)
on:
  workflow_dispatch:
    inputs:
      story: { description: 'yumurta/stories altındaki hikâye klasörü', required: true }
      parts: { description: 'paralel parça sayısı (Short 6-10, uzun video 20)', required: false, default: '8' }
      scale: { description: 'çözünürlük çarpanı (1 = tam)', required: false, default: '1' }
      crf: { description: 'x264 kalite (düşük = daha iyi)', required: false, default: '18' }
permissions:
  contents: read
concurrency:
  group: render-${{ inputs.story }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.p.outputs.parts }}
    steps:
      - id: p
        run: python3 -c "import json;n=int('${{ inputs.parts }}');print('parts='+json.dumps(list(range(n))))" >> "$GITHUB_OUTPUT"
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        part: ${{ fromJson(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: yumurta
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: paketler
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers ffmpeg fonts-noto-core > /dev/null
          cd yumurta/engine && npm ci --ignore-scripts --no-audit --no-fund
      - name: parçayı render et
        shell: bash
        env:
          CHROME_PATH: /usr/bin/google-chrome
          CHROME_ARGS: --use-angle=vulkan --enable-features=Vulkan --enable-unsafe-swiftshader
          NO_MUX: '1'
        run: |
          cd yumurta/engine
          S="${{ inputs.story }}"; P=${{ matrix.part }}; NAME=part_$(printf %03d $P)
          # parçalar kare sayısına göre değil render maliyetine göre (hareket bulanıklığı kareleri pahalı) eşit bölünür
          for try in 1 2 3; do OUT=$(node render.mjs "$S" --split=${{ inputs.parts }} --part=$P 2>&1) && break; echo "deneme $try olmadı"; sleep 5; done
          read -r _ FROM TO _ <<< "$(echo "$OUT" | grep '^SPLIT')"
          [ -n "$FROM" ] || { echo "$OUT" | grep -v "404 (Not Found)" | tail -30; exit 1; }
          echo "parça $P: $FROM - $TO sn"
          for try in 1 2; do node render.mjs "$S" --from=$FROM --to=$TO --scale=${{ inputs.scale }} --crf=${{ inputs.crf }} --name=$NAME 2>&1 | grep -v "404 (Not Found)" && break; echo "render denemesi $try olmadı"; sleep 5; done
          test -s "../stories/$S/out/$NAME.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.part }}
          path: yumurta/stories/${{ inputs.story }}/out/part_*.mp4
          if-no-files-found: error
          retention-days: 2
  join:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: yumurta
      - uses: actions/download-artifact@v4
        with: { pattern: part-*, path: parts, merge-multiple: true }
      - name: birleştir ve sesi ekle
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          for f in $(ls parts/part_*.mp4 | sort); do echo "file '$PWD/$f'" >> list.txt; done
          cat list.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i list.txt -c copy silent.mp4
          MIX=yumurta/stories/${{ inputs.story }}/audio/mix.wav
          mkdir -p final
          if [ -f "$MIX" ]; then
            ffmpeg -y -loglevel error -i silent.mp4 -i "$MIX" -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -af "loudnorm=I=-14:TP=-1.5:LRA=11" -shortest -movflags +faststart "final/${{ inputs.story }}.mp4"
          else
            cp silent.mp4 "final/${{ inputs.story }}.mp4"
          fi
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 "final/${{ inputs.story }}.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: final
          path: final/*.mp4
          retention-days: 7
